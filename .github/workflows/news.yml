name: News

# Headlines from primary and mainstream RSS feeds (Fed, ECB, SEC, BBC, NYT, CNBC, crypto press, Google News), tagged by
# symbol/topic, last 48 h, written to research/reports/news/latest.json. stdlib only: no pip install, nothing to break.

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect headlines
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m news.collector

      - name: Commit headlines
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -f research/reports/news/latest.json
          bash scripts/ci_commit_push.sh "news: run $(date -u +%Y-%m-%d_%H%M)"

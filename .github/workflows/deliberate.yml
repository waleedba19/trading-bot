name: Deliberate

# Three sessions per day (03:00, 09:00, 14:00 Africa/Tripoli) plus a 15:00
# "ready to trade" refresh. Times live ONLY in config/sessions.json; the cron
# block below is generated (python scripts/sessions.py --write) and CI fails if
# it drifts. GitHub cron is best-effort, so ticks fire every 10 minutes in the
# run-up to each open and scripts/session_gate.py runs the job once per session
# window. A dropped or late tick changes nothing. Manual dispatch always runs.
#
# Reads market data + committed evidence; writes decision JSON. Never places
# orders and never touches exchange credentials.

on:
  schedule:
    # BEGIN GENERATED SESSION CRONS (scripts/sessions.py --write; edit config/sessions.json)
    - cron: "17,27,37,47,57 0 * * *"   # deliberate session ticks (generated)
    - cron: "7,17,27,37 1 * * *"   # deliberate session ticks (generated)
    - cron: "17,27,37,47,57 6 * * *"   # deliberate session ticks (generated)
    - cron: "7,17,27,37 7 * * *"   # deliberate session ticks (generated)
    - cron: "17,27,37,47,57 11 * * *"   # deliberate session ticks (generated)
    - cron: "7,17,27,37,47,57 12 * * *"   # deliberate session ticks (generated)
    - cron: "7,17,27 13 * * *"   # deliberate session ticks (generated)
    # END GENERATED SESSION CRONS
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated symbols. Blank = auto shortlist from the multi-asset scan."
        type: string
        default: ""
      asof:
        description: "As-of timestamp (UTC ISO). Leave blank for now."
        type: string
        default: ""

concurrency:
  group: deliberate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliberate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide whether this session runs
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "$FORCE_RUN" = "1" ]; then
            python scripts/session_gate.py --workflow deliberate --force --github-env "$GITHUB_ENV"
          else
            python scripts/session_gate.py --workflow deliberate --github-env "$GITHUB_ENV"
          fi
          echo "gate: ${RUN_REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: env.RUN_NOW == '1'
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow yfinance

      - name: Install opencode (free models, no key needed)
        if: env.RUN_NOW == '1'
        # agents/common.py calls `opencode run -m opencode/<free model>`. Without
        # the CLI every decision was a rules-only fallback that blocks all pairs.
        # Pinned version; the two MODELS are the zero-credential free tier.
        run: |
          npm install -g opencode-ai@1.19.3
          opencode --version

      - name: Refresh multi-asset universe
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Crypto (exchange chain) + equities + FX (Yahoo). Bounded and
          # non-fatal: a data gap must not stop deliberation.
          python -m agents.universe --refresh --max 24 --days 400 || true

      - name: Resolve pairs (explicit or scan shortlist)
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          IN="${{ inputs.pairs }}"
          if [ -z "$IN" ]; then
            IN="$(python scripts/scan_shortlist.py --print 2>/dev/null || true)"
          fi
          if [ -z "$IN" ]; then
            IN="BTC/USDT,ETH/USDT,SOL/USDT"
            echo "::notice::no positive shortlist - using default pairs"
          fi
          echo "DELIB_PAIRS=$IN" >> "$GITHUB_ENV"
          echo "pairs=$IN" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deliberation
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -z "${{ inputs.asof }}" ]; then
            ASOF="$(date -u +%Y-%m-%dT%H:00:00)"
          else
            ASOF="${{ inputs.asof }}"
          fi
          python -m agents.deliberate \
            --pairs "$DELIB_PAIRS" \
            --asof "$ASOF"

      - name: Write daily brief
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Timestamped: the EOD learning brief and this midday brief must never
          # fight over the same tracked file (that caused a rebase conflict).
          STAMP="$(date -u +%Y-%m-%d_%H%M)"
          BRIEF="research/reports/brief/${STAMP}.md"
          python scripts/daily_brief.py --write --out "$BRIEF"
          echo "BRIEF_PATH=$BRIEF" >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 "$BRIEF" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit decisions
        if: env.RUN_NOW == '1'
        run: |
          git config user.name "deliberation-bot"
          git config user.email "deliberation-bot@users.noreply.github.com"
          # user_data/decisions/ is git-ignored, but it is exactly the file the
          # Render webhook reads, so force-add it.
          git add reports/decisions 2>/dev/null || echo "skip (nothing to add): reports/decisions"
          git add research/reports/brief 2>/dev/null || echo "skip (nothing to add): brief"
          git add -f user_data/decisions/latest.json 2>/dev/null || true
          # Never force-push: rebase + retry keeps parallel workflow commits.
          bash scripts/ci_commit_push.sh "deliberation: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        if: always() && env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "### Deliberation cycle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "gate decision: see the gate step; sessions in config/sessions.json." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls reports/decisions 2>/dev/null | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Cite the latest Vibe-Trading alpha benchmark (no-op when absent).
          python -m agents.vibe_evidence >> "$GITHUB_STEP_SUMMARY" || true

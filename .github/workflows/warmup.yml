name: Warmup

# Trade Agent warmup, once per session window (03:00, 09:00, 14:00 Africa/Tripoli),
# finished before the Deliberate run of the same session. Times live ONLY in
# config/sessions.json; the cron block is generated (scripts/sessions.py --write).
# Fetches LIVE candles from Kraken before the verdict.

on:
  schedule:
    # BEGIN GENERATED SESSION CRONS (scripts/sessions.py --write; edit config/sessions.json)
    - cron: "7,17,27,37 0 * * *"   # warmup session ticks (generated)
    - cron: "37,47,57 5 * * *"   # warmup session ticks (generated)
    - cron: "7,17,27,37 6 * * *"   # warmup session ticks (generated)
    - cron: "37,47,57 10 * * *"   # warmup session ticks (generated)
    - cron: "7,17,27,37 11 * * *"   # warmup session ticks (generated)
    - cron: "37,47,57 23 * * *"   # warmup session ticks (generated)
    # END GENERATED SESSION CRONS
  workflow_dispatch:
    inputs:
      all:
        description: "Include AAPL equity"
        type: boolean
        default: true
      pairs:
        description: "Comma-separated base symbols. Blank = BTC,ETH,SOL (also the scheduled-run default)."
        type: string
        default: ""

concurrency:
  group: warmup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide whether this session runs
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "$FORCE_RUN" = "1" ]; then
            python scripts/session_gate.py --workflow warmup --force --github-env "$GITHUB_ENV"
          else
            python scripts/session_gate.py --workflow warmup --github-env "$GITHUB_ENV"
          fi
          echo "gate: ${RUN_REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: env.RUN_NOW == '1'
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow requests yfinance

      - name: Fetch LIVE candles from Kraken
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Scheduled runs have no inputs: inputs.pairs expands to "" and the
          # old command died with "argument --pairs: expected at least one
          # argument" (that was the 2026-10-23 18:44 UTC failure). Default here.
          PAIRS="${{ inputs.pairs }}"
          if [ -z "$PAIRS" ]; then
            PAIRS="BTC,ETH,SOL"
          fi
          echo "fetch pairs: $PAIRS"
          # Network flake must not abort the whole warmup: verdicts/scan can run
          # on the committed cache, and the warning is visible in the log.
          python fetch_live.py --pairs $(echo "$PAIRS" | tr ',' ' ') --tf 1h 4h 1d \
            || echo "::warning::live candle fetch failed - continuing on cached data"

      - name: Run warmup
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python run_warmup.py --all

      - name: Scan for most profitable pairs
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Multi-asset scan: crypto majors (exchange chain), US large caps and
          # FX majors (Yahoo). Missing symbols are fetched into git-ignored
          # caches; the repo stays lean.
          python asset_scanner.py --top 20 --asset-class all --max-pairs 24 --fetch-missing --json \
            > research/reports/asset_scan.json 2> research/reports/asset_scan_diagnostics.txt
          python scripts/scan_shortlist.py
          # Surface the skip reasons in the run log as well as the artifact.
          tail -n 25 research/reports/asset_scan_diagnostics.txt
          python summary_scan.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit warmup report
        if: env.RUN_NOW == '1'
        run: |
          git config user.name "warmup-bot"
          git config user.email "warmup-bot@users.noreply.github.com"
          # Tolerant adds: under `bash -e` a missing or fully-ignored pathspec
          # aborts the whole job (this is how the 2026-10-23 outcome run died).
          for p in research/reports/warmup research/reports/verdicts research/reports/asset_scan.json research/reports/asset_scan_diagnostics.txt research/reports/scan_shortlist.json research/data; do
            git add "$p" 2>/dev/null || echo "skip (nothing to add): $p"
          done
          # Never force-push: rebase + retry, so parallel workflows and the PC
          # can never lose each other's commits.
          bash scripts/ci_commit_push.sh "warmup: run $(date -u +%Y-%m-%d_%H%M)"

      - name: Summary
        if: env.RUN_NOW == '1'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "### Warmup complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fresh candles fetched from Kraken before verdict.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python summary_warmup.py >> $GITHUB_STEP_SUMMARY